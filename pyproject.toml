[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operations-kpi-rollup"
version = "0.2.1"
description = "Reproducible Operations, Quality, and Shipping KPI email rollups"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Jinja2>=3.1,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
sql = ["pyodbc>=5.1,<6"]
dev = ["pytest>=8,<9"]

[project.scripts]
operations-kpi-rollup = "operations_kpi_rollup.cli:main"
operations-kpi-wallboard = "operations_kpi_rollup.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
operations_kpi_rollup = ["templates/*.j2", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
